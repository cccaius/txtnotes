name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Check Java version
      run: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"

    - name: Grant execute permission for gradlew
      working-directory: TXTNotes
      run: chmod +x gradlew

    - name: Build APK
      working-directory: TXTNotes
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: txtnotes-debug-apk
        path: TXTNotes/**/build/outputs/apk/**/*.apk
